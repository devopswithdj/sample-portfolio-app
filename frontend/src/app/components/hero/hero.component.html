<section class="hero">
  <div class="hero-background">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
  </div>
  
  <div class="container">
    <div class="hero-content">
      <div class="hero-label fade-in">Full Stack Developer</div>
      <h1 class="hero-title fade-in-up">
        Crafting Digital
        <span class="highlight">Experiences</span>
      </h1>
      <p class="hero-description slide-in-right">
        Transforming ideas into elegant, scalable solutions with modern technologies.
        Passionate about clean code, innovative design, and exceptional user experiences.
      </p>
      <div class="hero-actions fade-in-up">
        <button class="btn btn-primary" (click)="scrollToSection('projects')">
          View My Work
        </button>
        <button class="btn btn-outline" (click)="scrollToSection('contact')">
          Get In Touch
        </button>
      </div>
      
      <div class="hero-stats">
        <div class="stat">
          <div class="stat-number">50+</div>
          <div class="stat-label">Projects Completed</div>
        </div>
        <div class="stat">
          <div class="stat-number">5+</div>
          <div class="stat-label">Years Experience</div>
        </div>
        <div class="stat">
          <div class="stat-number">30+</div>
          <div class="stat-label">Happy Clients</div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="scroll-indicator">
    <div class="mouse">
      <div class="wheel"></div>
    </div>
    <div class="arrow-down"></div>
  </div>
</section>
